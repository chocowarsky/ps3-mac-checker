name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate JSON manifests and Python syntax
        run: |
          python3 -m py_compile ps3_mac_manager.py
          python3 -c '
          import json, pathlib
          for p in ["plugin.json", ".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"]:
              json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              print("valid JSON:", p)
          '

      - name: Run offline unit and CLI tests
        run: python3 -m unittest discover -s tests -v

      - name: Smoke test wheel build and installed CLI entrypoint
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build --wheel
          python3 -m pip install dist/*.whl
          ps3-mac-manager --version
          ps3-mac-manager --doctor --json
